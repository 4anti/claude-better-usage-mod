<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>What each chat costs: under the 5 Hour bar, This chat used 3% – last reply 0.5%</title>
<style>
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 10s cubic-bezier(.2,.7,.2,1) infinite}
.tick{animation:tick 10s cubic-bezier(.2,.7,.2,1) infinite}
.fade{animation:fade 10s ease infinite}
.early{opacity:0;animation:early 10s cubic-bezier(.2,.7,.2,1) infinite}
.late{animation:late 10s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(0)}16%,100%{transform:scaleX(1)}}
@keyframes tick{0%,10%{opacity:0}22%,100%{opacity:1}}
@keyframes fade{0%,4%{opacity:0}14%,100%{opacity:1}}
@keyframes early{0%,16%{opacity:0}24%,50%{opacity:1}56%,100%{opacity:0}}
@keyframes late{0%,52%{opacity:0}60%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.grow,.tick,.fade,.early,.late{animation:none}}
</style>
<rect x=".5" y=".5" width="559" height="299" rx="12" fill="#212121" stroke="#2c2c2b"/>
<text x="26" y="44" fill="#efefec" font-size="19" font-weight="600">What each chat costs</text>
<text x="26" y="72" fill="#9a9a96" font-size="14.5">Measured from each reply’s start to its end.</text>
<text x="26" y="140" fill="#efefec" font-size="16" font-weight="600">5 Hour</text>
<rect x="106" y="132" width="372" height="8" rx="4" fill="#333332"/>
<rect class="grow" x="106" y="132" width="126" height="8" rx="4" fill="#9a9a96"/>
<rect class="tick" x="335" y="131" width="3" height="10" fill="#dcdbd6"/>
<text x="534" y="141" fill="#9a9a96" font-size="16" font-weight="600" text-anchor="end">34%</text>
<text class="fade" x="26" y="168" fill="#9a9a96" font-size="14.5">On pace for about 62% by reset – resets in 3h 10m</text>
<text class="early" x="26" y="194" fill="#9a9a96" font-size="14.5">This chat used 2.5% – last reply 0.4%</text>
<text class="late" x="26" y="194" fill="#9a9a96" font-size="14.5">This chat used 3% – last reply 0.5%</text>
<rect x="26" y="228" width="508" height="1" fill="#2c2c2b"/>
<text x="26" y="262" fill="#9a9a96" font-size="14">Your share of the 5 Hour limit. On or off in /quota-settings.</text>
</svg>
