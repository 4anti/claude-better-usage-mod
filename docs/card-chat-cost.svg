<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>What each chat costs: a reply streams in, a coin drops on the stack and This chat used 3% – last reply 0.5% counts up</title>
<style>
.blob{transform-box:fill-box;transform-origin:center;animation:drift 12s ease-in-out infinite alternate}
.b1{animation-duration:10s;animation-delay:-4s}.b2{animation-duration:14s;animation-delay:-7s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-14px) scale(1.12)}100%{transform:translate(-22px,12px) scale(.94)}}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(0)}45%,100%{transform:translateX(620px)}}

.ub{transform-box:fill-box;transform-origin:right bottom;animation:ub 8s ease-out infinite -5.6s}
@keyframes ub{0%{opacity:0;transform:scale(.85)}5%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
.ab{transform-box:fill-box;transform-origin:left top;animation:ab 8s ease-out infinite -5.6s}
@keyframes ab{0%,7%{opacity:0;transform:scale(.9)}12%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
.typ{opacity:0;animation:typ 8s linear infinite -5.6s}
@keyframes typ{0%,11%{opacity:0}13%,24%{opacity:1}26%,100%{opacity:0}}
.dot{animation:dot .9s ease-in-out infinite -5.6s}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.ln{transform-box:fill-box;transform-origin:left center}
.l1{animation:l1 8s linear infinite -5.6s}.l2{animation:l2 8s linear infinite -5.6s}.l3{animation:l3 8s linear infinite -5.6s}
@keyframes l1{0%,26%{transform:scaleX(0)}37%,100%{transform:scaleX(1)}}
@keyframes l2{0%,37%{transform:scaleX(0)}48%,100%{transform:scaleX(1)}}
@keyframes l3{0%,48%{transform:scaleX(0)}56%,100%{transform:scaleX(1)}}
.drop{animation:drop 8s infinite -5.6s}
@keyframes drop{0%,57%{opacity:0;transform:translateY(-50px);animation-timing-function:ease-in}63%{opacity:1;transform:translateY(0);animation-timing-function:ease-out}65.5%{transform:translateY(-6px);animation-timing-function:ease-in}68%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}
.plus{opacity:0;animation:plus 8s ease-out infinite -5.6s}
@keyframes plus{0%,62%{opacity:0;transform:translateY(10px)}66%{opacity:1;transform:translateY(0)}80%,100%{opacity:0;transform:translateY(-14px)}}
.f0{opacity:0;animation:f0 8s step-end infinite -5.6s}@keyframes f0{0%{opacity:1}26%{opacity:0}47%{opacity:1}54%{opacity:0}96%{opacity:1}100%{opacity:0}}
.f1{opacity:0;animation:f1 8s step-end infinite -5.6s}@keyframes f1{0%{opacity:0}26%{opacity:1}33%{opacity:0}100%{opacity:0}}
.f2{opacity:0;animation:f2 8s step-end infinite -5.6s}@keyframes f2{0%{opacity:0}33%{opacity:1}40%{opacity:0}100%{opacity:0}}
.f3{opacity:0;animation:f3 8s step-end infinite -5.6s}@keyframes f3{0%{opacity:0}40%{opacity:1}47%{opacity:0}100%{opacity:0}}
.f4{opacity:0;animation:f4 8s step-end infinite -5.6s}@keyframes f4{0%{opacity:0}54%{opacity:1}63%{opacity:0}100%{opacity:0}}
.f5{animation:f5 8s step-end infinite -5.6s}@keyframes f5{0%{opacity:0}63%{opacity:1}96%{opacity:0}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#201f1d"/><stop offset="1" stop-color="#171615"/></linearGradient>
<clipPath id="cc"><rect x="1" y="1" width="558" height="298" rx="18"/></clipPath>
<linearGradient id="tg" x1="32" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f0a483"/><stop offset=".45" stop-color="#d97757"/><stop offset="1" stop-color="#e5b54a"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="tc"><text x="32" y="212" font-size="27" font-weight="700">What each chat costs</text></clipPath>
<radialGradient id="bl0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><radialGradient id="bl1"><stop offset="0" stop-color="#e5b54a" stop-opacity="0.22"/><stop offset="1" stop-color="#e5b54a" stop-opacity="0"/></radialGradient><radialGradient id="bl2"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7d987"/><stop offset="1" stop-color="#e5b54a"/></linearGradient>
<radialGradient id="cglow"><stop offset="0" stop-color="#e5b54a" stop-opacity=".4"/><stop offset="1" stop-color="#e5b54a" stop-opacity="0"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="559" height="299" rx="18" fill="url(#card)" stroke="#3a3936"/>
<g clip-path="url(#cc)"><circle class="blob b0" cx="150" cy="90" r="220" fill="url(#bl0)"/><circle class="blob b1" cx="440" cy="110" r="170" fill="url(#bl1)"/><circle class="blob b2" cx="520" cy="300" r="170" fill="url(#bl2)"/></g>
<g class="ub"><rect x="128" y="18" width="172" height="28" rx="13" fill="#d97757" fill-opacity=".22" stroke="#d97757" stroke-opacity=".55"/>
<rect x="144" y="28" width="140" height="8" rx="4" fill="#f0a483" fill-opacity=".8"/></g>
<g class="ab"><path d="M46 54 H286 a14 14 0 0 1 14 14 V104 a14 14 0 0 1 -14 14 H46 a14 14 0 0 1 -14 -14 V68 a14 14 0 0 1 14 -14 Z" fill="#252422" stroke="#3a3936"/>
<g class="typ"><circle class="dot" cx="56" cy="86" r="4.5" fill="#b8b6b0" style="animation-delay:0.00s"/><circle class="dot" cx="71" cy="86" r="4.5" fill="#b8b6b0" style="animation-delay:0.15s"/><circle class="dot" cx="86" cy="86" r="4.5" fill="#b8b6b0" style="animation-delay:0.30s"/></g><rect class="ln l1" x="48" y="68" width="236" height="8" rx="4" fill="#b8b6b0" fill-opacity=".55"/><rect class="ln l2" x="48" y="82" width="204" height="8" rx="4" fill="#b8b6b0" fill-opacity=".55"/><rect class="ln l3" x="48" y="96" width="140" height="8" rx="4" fill="#b8b6b0" fill-opacity=".55"/></g>
<circle cx="440" cy="86" r="96" fill="url(#cglow)"/>
<path d="M394 102 v9 a46 13 0 0 0 92 0 v-9 z" fill="#a8761f"/><ellipse cx="440" cy="102" rx="46" ry="13" fill="url(#coin)"/><ellipse cx="440" cy="102" rx="34" ry="9" fill="none" stroke="#9a6a18" stroke-opacity=".55" stroke-width="1.5"/><text x="440" y="107.5" text-anchor="middle" font-size="16" font-weight="800" fill="#8a5d14">%</text><path d="M394 91 v9 a46 13 0 0 0 92 0 v-9 z" fill="#a8761f"/><ellipse cx="440" cy="91" rx="46" ry="13" fill="url(#coin)"/><ellipse cx="440" cy="91" rx="34" ry="9" fill="none" stroke="#9a6a18" stroke-opacity=".55" stroke-width="1.5"/><text x="440" y="96.5" text-anchor="middle" font-size="16" font-weight="800" fill="#8a5d14">%</text><path d="M394 80 v9 a46 13 0 0 0 92 0 v-9 z" fill="#a8761f"/><ellipse cx="440" cy="80" rx="46" ry="13" fill="url(#coin)"/><ellipse cx="440" cy="80" rx="34" ry="9" fill="none" stroke="#9a6a18" stroke-opacity=".55" stroke-width="1.5"/><text x="440" y="85.5" text-anchor="middle" font-size="16" font-weight="800" fill="#8a5d14">%</text>
<g class="drop"><path d="M394 69 v9 a46 13 0 0 0 92 0 v-9 z" fill="#a8761f"/><ellipse cx="440" cy="69" rx="46" ry="13" fill="url(#coin)"/><ellipse cx="440" cy="69" rx="34" ry="9" fill="none" stroke="#9a6a18" stroke-opacity=".55" stroke-width="1.5"/><text x="440" y="74.5" text-anchor="middle" font-size="16" font-weight="800" fill="#8a5d14">%</text></g>
<rect x="32" y="132" width="496" height="34" rx="10" fill="#1c1b1a" fill-opacity=".8" stroke="#3a3936"/>
<rect x="32" y="140" width="3" height="18" rx="1.5" fill="#22d3ee"/>
<text class="plus" x="440" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#22d3ee">+0.5%</text>
<text class="f0" x="48" y="155" font-size="17" fill="#b8b6b0">This chat used <tspan font-weight="700" fill="#f3f2ee">2%</tspan> – last reply <tspan font-weight="700" fill="#22d3ee">0.4%</tspan></text><text class="f1" x="48" y="155" font-size="17" fill="#b8b6b0">This chat used <tspan font-weight="700" fill="#f3f2ee">2%</tspan> – last reply <tspan font-weight="700" fill="#22d3ee">0.1%</tspan></text><text class="f2" x="48" y="155" font-size="17" fill="#b8b6b0">This chat used <tspan font-weight="700" fill="#f3f2ee">2%</tspan> – last reply <tspan font-weight="700" fill="#22d3ee">0.2%</tspan></text><text class="f3" x="48" y="155" font-size="17" fill="#b8b6b0">This chat used <tspan font-weight="700" fill="#f3f2ee">2%</tspan> – last reply <tspan font-weight="700" fill="#22d3ee">0.3%</tspan></text><text class="f4" x="48" y="155" font-size="17" fill="#b8b6b0">This chat used <tspan font-weight="700" fill="#f3f2ee">2%</tspan> – last reply <tspan font-weight="700" fill="#22d3ee">0.5%</tspan></text><text class="f5" x="48" y="155" font-size="17" fill="#b8b6b0">This chat used <tspan font-weight="700" fill="#f3f2ee">3%</tspan> – last reply <tspan font-weight="700" fill="#22d3ee">0.5%</tspan></text>
<text x="32" y="212" font-size="27" font-weight="700" fill="url(#tg)">What each chat costs</text>
<g clip-path="url(#tc)"><rect class="sheen" x="-140" y="180" width="120" height="40" fill="url(#sh)" style="animation-delay:3.6s"/></g>
<text x="32" y="244" font-size="18" fill="#b8b6b0">Measured from each reply’s start to its end.</text>
</svg>
