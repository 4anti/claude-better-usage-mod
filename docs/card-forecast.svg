<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Forecast to the reset: each limit's bar with a tick where it lands by its reset, on track for 5 Hour, a warning for Weekly</title>
<style>
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 10s cubic-bezier(.2,.7,.2,1) infinite both}
.tick{animation:tick 10s cubic-bezier(.2,.7,.2,1) infinite both}
.fade{animation:fade 10s cubic-bezier(.2,.7,.2,1) infinite both}
.d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}
@keyframes grow{0%{transform:scaleX(0)}16%,100%{transform:scaleX(1)}}
@keyframes tick{0%,12%{opacity:0}22%,100%{opacity:1}}
@keyframes fade{0%,4%{opacity:0}14%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.grow,.tick,.fade{animation:none}}
</style>
<rect x=".5" y=".5" width="559" height="299" rx="12" fill="#212121" stroke="#2c2c2b"/>
<text x="26" y="44" fill="#efefec" font-size="19" font-weight="600">Forecast to the reset</text>
<text x="26" y="72" fill="#9a9a96" font-size="14.5">On pace for about 55% by reset, or a warning before you run out.</text>
<text class="fade d3" x="26" y="120" fill="#aca285" font-size="15" font-weight="600">At this pace you'll run out before Sunday's reset.</text>
<text x="26" y="166" fill="#efefec" font-size="16" font-weight="600">5 Hour</text>
<rect x="110" y="158" width="364" height="8" rx="4" fill="#333332"/>
<rect class="grow" x="110" y="158" width="25" height="8" rx="4" fill="#9a9a96"/>
<rect class="tick d1" x="309" y="157" width="3" height="10" fill="#dcdbd6"/>
<text x="534" y="167" fill="#9a9a96" font-size="16" font-weight="600" text-anchor="end">7%</text>
<text class="fade d1" x="26" y="191" fill="#9a9a96" font-size="14.5">On pace for about 55% by reset – resets in 4h 50m</text>
<text x="26" y="234" fill="#efefec" font-size="16" font-weight="600">Weekly</text>
<rect x="110" y="226" width="364" height="8" rx="4" fill="#333332"/>
<rect class="grow d1" x="110" y="226" width="207" height="8" rx="4" fill="#aca285"/>
<rect class="tick d2" x="470" y="225" width="3" height="10" fill="#e5534b"/>
<text x="534" y="235" fill="#aca285" font-size="16" font-weight="600" text-anchor="end">57%</text>
<text class="fade d2" x="26" y="259" fill="#9a9a96" font-size="14.5">Limit will hit in 3d 3h – resets in 5d 11h</text>
</svg>
