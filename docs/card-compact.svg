<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Compact and Auto compact: the switch is on at 30%, the context fills to 30%, auto compacts down and fills again</title>
<style>
.ctx{transform-box:fill-box;transform-origin:left center;animation:ctx 12s cubic-bezier(.2,.7,.2,1) infinite}
.s30{animation:s30 12s ease infinite}
.s6,.s12,.s18,.s24{opacity:0}
.s6{animation:s6 12s ease infinite}.s12{animation:s12 12s ease infinite}
.s18{animation:s18 12s ease infinite}.s24{animation:s24 12s ease infinite}
.note{animation:note 12s ease infinite}
@keyframes ctx{0%,28%{transform:scaleX(1)}34%{transform:scaleX(.28)}40%{transform:scaleX(.28);animation-timing-function:linear}88%,100%{transform:scaleX(1)}}
@keyframes s30{0%,29%{opacity:1}31%,87%{opacity:0}89%,100%{opacity:1}}
@keyframes s6{0%,31%{opacity:0}33%,51%{opacity:1}53%,100%{opacity:0}}
@keyframes s12{0%,51%{opacity:0}53%,63%{opacity:1}65%,100%{opacity:0}}
@keyframes s18{0%,63%{opacity:0}65%,75%{opacity:1}77%,100%{opacity:0}}
@keyframes s24{0%,75%{opacity:0}77%,87%{opacity:1}89%,100%{opacity:0}}
@keyframes note{0%,28%{opacity:1}31%,89%{opacity:0}94%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ctx,.s30,.s6,.s12,.s18,.s24,.note{animation:none}}
</style>
<defs><clipPath id="track"><rect x="26" y="168" width="508" height="8" rx="4"/></clipPath></defs>
<rect x=".5" y=".5" width="559" height="299" rx="12" fill="#212121" stroke="#2c2c2b"/>
<text x="26" y="44" fill="#efefec" font-size="19" font-weight="600">Compact &amp; Auto compact</text>
<text x="26" y="72" fill="#9a9a96" font-size="14.5">One click, or automatically at your % – never mid-reply.</text>
<rect x="26" y="115" width="30" height="18" rx="9" fill="#4ade80"/><circle cx="47" cy="124" r="6" fill="#efefec"/>
<text x="68" y="129" fill="#efefec" font-size="15">Auto compact</text>
<rect x="174.5" y="112.5" width="38" height="23" rx="5" fill="#151515" stroke="#333332"/>
<text x="193.5" y="129" fill="#efefec" font-size="14" text-anchor="middle">30</text>
<text x="218" y="129" fill="#9a9a96" font-size="15">%</text>
<rect x="258" y="111" width="86" height="26" rx="6" fill="#373838"/>
<text x="301" y="129" fill="#efefec" font-size="14" text-anchor="middle">Compact</text>
<text x="356" y="129" fill="#efefec" font-size="13">▼</text>
<rect x="26" y="168" width="508" height="8" rx="4" fill="#333332"/>
<g clip-path="url(#track)"><g class="ctx">
  <rect x="26" y="168" width="127" height="8" fill="#78d0ea"/>
  <rect x="153" y="168" width="13" height="8" fill="#a48ef2"/>
  <rect x="166" y="168" width="29" height="8" fill="#4d4d4a"/>
</g></g>
<text x="26" y="206" fill="#efefec" font-size="16" font-weight="600">Context</text>
<g class="s30"><text x="106" y="206" fill="#aca285" font-size="16" font-weight="600">30% used</text><text x="534" y="206" fill="#9a9a96" font-size="15" text-anchor="end">667k free of 1M</text></g>
<g class="s6"><text x="106" y="206" fill="#9a9a96" font-size="16" font-weight="600">6% used</text><text x="534" y="206" fill="#9a9a96" font-size="15" text-anchor="end">907k free of 1M</text></g>
<g class="s12"><text x="106" y="206" fill="#9a9a96" font-size="16" font-weight="600">12% used</text><text x="534" y="206" fill="#9a9a96" font-size="15" text-anchor="end">847k free of 1M</text></g>
<g class="s18"><text x="106" y="206" fill="#9a9a96" font-size="16" font-weight="600">18% used</text><text x="534" y="206" fill="#9a9a96" font-size="15" text-anchor="end">787k free of 1M</text></g>
<g class="s24"><text x="106" y="206" fill="#9a9a96" font-size="16" font-weight="600">24% used</text><text x="534" y="206" fill="#9a9a96" font-size="15" text-anchor="end">727k free of 1M</text></g>
<rect x="26" y="232" width="508" height="1" fill="#2c2c2b"/>
<text class="note" x="26" y="264" fill="#9a9a96" font-size="14.5">Context at 30%: auto compacting (set at 30%)</text>
</svg>
