  <path d="M-10 -9 H10 A3 3 0 0 1 13 -6 V3 A3 3 0 0 1 10 6 H-1 L-7 11 V6 H-10 A3 3 0 0 1 -13 3 V-6 A3 3 0 0 1 -10 -9 Z"/>
  <path d="M-7 -3 H7 M-7 1.5 H2"/>
</g>
<text x="124" y="277" font-size="18" class="h">Each reply's limits</text>
<text x="124" y="301" class="s">read live from the session,</text>
<text x="124" y="322" class="s hi">every 3 s</text>

<!-- middle -->
<rect x="470" y="148" width="236" height="160" rx="14" fill="url(#node)" stroke="#3a3936"/>
<rect x="470" y="148" width="236" height="160" rx="14" fill="url(#vio)" stroke="#a78bfa" stroke-opacity=".28"/>
<circle class="spin fx" cx="588" cy="188" r="30" fill="none" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 6"/>
<rect class="halo pM" x="470" y="148" width="236" height="160" rx="14" fill="none" stroke="#a78bfa" stroke-opacity=".85"/>
<rect x="566" y="166" width="44" height="44" rx="12" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa" stroke-opacity=".4"/>
<g transform="translate(588 188)" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-8 -10 C-8 -2 0 -3 0 4 M8 -10 C8 -2 0 -3 0 4 M0 4 V10 M-4 6.5 L0 10.5 L4 6.5"/>
</g>
<text x="588" y="240" font-size="18" text-anchor="middle" class="h">Merged per window</text>
<text x="588" y="264" text-anchor="middle" class="s">newest reading wins,</text>
<text x="588" y="285" text-anchor="middle" class="s">shared by every open chat</text>

<!-- ports -->
<g stroke="#171615" stroke-width="2">
  <circle cx="378" cy="162" r="4.5" fill="#e5b54a"/>
  <circle cx="378" cy="294" r="4.5" fill="#22d3ee"/>
  <circle cx="470" cy="228" r="4.5" fill="#a78bfa"/>
  <circle cx="706" cy="228" r="4.5" fill="#a78bfa"/>
  <circle cx="798" cy="228" r="4.5" fill="#d97757"/>
</g>

<!-- output -->
<rect x="798" y="104" width="354" height="248" rx="16" fill="url(#node)" stroke="#5a3c30"/>
<path class="tr" pathLength="100" filter="url(#spark)" d="M814 104 H1136 A16 16 0 0 1 1152 120 V336 A16 16 0 0 1 1136 352 H814 A16 16 0 0 1 798 336 V120 A16 16 0 0 1 814 104 Z" fill="none" stroke="#f0a483" stroke-width="7" stroke-linecap="round"/>
<path class="tr" pathLength="100" d="M814 104 H1136 A16 16 0 0 1 1152 120 V336 A16 16 0 0 1 1136 352 H814 A16 16 0 0 1 798 336 V120 A16 16 0 0 1 814 104 Z" fill="none" stroke="url(#trace)" stroke-width="2.5" stroke-linecap="round"/>
<text x="816" y="140" font-size="19" class="h">The band above your prompt</text>
<circle class="ring fx" cx="1130" cy="134" r="4" fill="#4ade80"/>
<circle cx="1130" cy="134" r="4" fill="#4ade80"/>

<rect x="816" y="158" width="318" height="132" rx="10" fill="#262624" stroke="#3a3936"/>
<g font-size="16">
  <text x="834" y="190" class="h">5H</text>
  <text x="834" y="228" class="h">Weekly</text>
  <text x="834" y="266" class="h">Context</text>
</g>
<!-- 5H -->
<rect x="912" y="179" width="150" height="8" rx="4" fill="#333332"/>
<rect class="bar q h5" x="912" y="179" width="150" height="8" rx="4"/>
<rect class="q tk" x="912" y="176" width="3" height="14" rx="1.5"/>
<!-- Weekly -->
<rect x="912" y="217" width="150" height="8" rx="4" fill="#333332"/>
<rect class="bar q wk" x="912" y="217" width="150" height="8" rx="4"/>
<rect x="1058" y="214" width="3" height="14" rx="1.5" fill="#e5534b"/>
<!-- Context -->
<rect x="912" y="255" width="150" height="8" rx="4" fill="#333332"/>
<g class="bar q cx">
  <rect x="912" y="255" width="150" height="8" rx="4" fill="#9b9a96"/>
  <rect x="912" y="255" width="139" height="8" rx="4" fill="#a78bfa"/>
  <rect x="912" y="255" width="126" height="8" rx="4" fill="#22d3ee"/>
</g>
<!-- ticking numbers -->
<g font-size="16" font-weight="600" text-anchor="end">
  <text x="1116" y="190" class="f k0" fill="#9b9a96">18%</text>
  <text x="1116" y="190" class="f k1 on" fill="#9b9a96">37%</text>
  <text x="1116" y="190" class="f k2" fill="#b3a37e">58%</text>
  <text x="1116" y="190" class="f k3" fill="#e5a14a">79%</text>
  <text x="1116" y="228" class="f k0" fill="#b0a281">57%</text>
  <text x="1116" y="228" class="f k1 on" fill="#dcb253">72%</text>
  <text x="1116" y="228" class="f k2" fill="#e57f4b">86%</text>
  <text x="1116" y="228" class="f k3" fill="#e5534b">97%</text>
  <text x="1116" y="266" class="f k0" fill="#c2a86e">38%</text>
  <text x="1116" y="266" class="f k1 on" fill="#d3ae5c">45%</text>
  <text x="1116" y="266" class="f k2" fill="#e5ab4a">53%</text>
  <text x="1116" y="266" class="f k3" fill="#e58e4a">62%</text>
</g>
<!-- prompt -->
<rect x="816" y="302" width="318" height="34" rx="10" fill="#1b1a19" stroke="#3a3936"/>
<text x="832" y="325" font-size="20" font-weight="700" fill="#d97757">›</text>
<rect class="caret" x="848" y="311" width="2" height="16" rx="1" fill="#f3f2ee"/>

<!-- footer -->
<rect x="48" y="378" width="1104" height="64" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#2f2e2b"/>
<g clip-path="url(#stripClip)"><rect class="sweep" x="48" y="378" width="260" height="64" fill="url(#shine)"/></g>
<g stroke="#2f2e2b"><path d="M416 392 V428 M784 392 V428"/></g>
<g font-size="17" fill="#f3f2ee">
  <g transform="translate(150 410)">
    <circle class="bd bd1" r="20" fill="none" stroke="#e5b54a" stroke-width="1.5"/>
    <circle r="16" fill="#e5b54a" fill-opacity=".14"/>
    <g fill="none" stroke="#e5b54a" stroke-width="2" stroke-linecap="round"><circle r="7.5"/><path d="M-5.5 5.5 L5.5 -5.5"/></g>
    <text x="28" y="6">No tokens used</text>
  </g>
  <g transform="translate(470 410)">
    <circle class="bd bd2" r="20" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <circle r="16" fill="#4ade80" fill-opacity=".13"/>
    <g fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -9 L7.5 -6 V0 C7.5 5 4 8 0 9.5 C-4 8 -7.5 5 -7.5 0 V-6 Z"/><path d="M-3.5 0 L-1 2.5 L3.5 -2"/></g>
    <text x="28" y="6">Never sees your credentials</text>
  </g>
  <g transform="translate(822 410)">
    <circle class="bd bd3" r="20" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <circle r="16" fill="#22d3ee" fill-opacity=".13"/>
    <g fill="none" stroke="#22d3ee" stroke-width="2"><circle r="7.5"/><ellipse rx="3.2" ry="7.5"/><path d="M-7.5 0 H7.5"/></g>
    <text x="28" y="6">One host: <tspan class="mono" fill="#f0a483">api.anthropic.com</tspan></text>
  </g>
</g>
</svg>
