<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">How it works</title>
<desc id="d">Anthropic's usage service (about every 2 minutes) and each reply's limits (every 3 seconds) are merged per window, newest reading wins, and drawn as the band above your prompt. No tokens used, never sees your credentials, one host: api.anthropic.com.</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#201f1d"/><stop offset="1" stop-color="#171615"/></linearGradient>
  <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#282725"/><stop offset="1" stop-color="#1e1d1b"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d97757"/><stop offset="1" stop-color="#e5b54a"/></linearGradient>
  <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="378" y1="0" x2="470" y2="0"><stop offset="0" stop-color="#e5b54a"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="378" y1="0" x2="470" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="706" y1="0" x2="798" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#d97757"/></linearGradient>
  <linearGradient id="trace" gradientUnits="userSpaceOnUse" x1="798" y1="104" x2="1152" y2="352"><stop offset="0" stop-color="#f0a483"/><stop offset=".5" stop-color="#e5b54a"/><stop offset="1" stop-color="#d97757"/></linearGradient>
  <radialGradient id="vio" cx=".5" cy=".25" r=".8"><stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="blob" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1800" height="1080"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="480"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="spark" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="480"><feGaussianBlur stdDeviation="3.5"/></filter>
  <clipPath id="cardClip"><rect x="1" y="1" width="1198" height="478" rx="18"/></clipPath>
  <clipPath id="stripClip"><rect x="48" y="378" width="1104" height="64" rx="14"/></clipPath>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".045"/></pattern>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h{font-weight:700;fill:#f3f2ee}
  .s{fill:#b8b6b0;font-size:16px}
  .m{fill:#8a8984}
  .hi{fill:#f0a483}
  .fx{transform-box:fill-box;transform-origin:center}
  .bar{transform-box:fill-box;transform-origin:left center}

  .b1{animation:dA 13s ease-in-out infinite alternate}
  .b2{animation:dB 11s ease-in-out infinite alternate}
  .b3{animation:dC 14s ease-in-out infinite alternate}
  .b4{animation:dD 9s ease-in-out infinite alternate}
  @keyframes dA{0%{transform:translate(0,0);opacity:.26}100%{transform:translate(-50px,22px);opacity:.35}}
  @keyframes dB{0%{transform:translate(0,0);opacity:.22}100%{transform:translate(60px,30px);opacity:.32}}
  @keyframes dC{0%{transform:translate(0,0);opacity:.2}100%{transform:translate(40px,-40px);opacity:.3}}
  @keyframes dD{0%{transform:translate(0,0);opacity:.18}100%{transform:translate(-40px,-24px);opacity:.3}}

  .flow{stroke-dasharray:5 7;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-12}}
  .neon{opacity:.45}
  .spin{animation:spin 12s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bd{opacity:.15;animation:bd 6s ease-in-out infinite}
  .bd2{animation-delay:2s}.bd3{animation-delay:4s}
  @keyframes bd{0%,100%{opacity:.15}15%{opacity:.6}35%{opacity:.15}}

  .cm{stroke-dasharray:9 200;stroke-dashoffset:9;opacity:0;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  .cA{animation-name:cA;animation-duration:10s}
  .cB{animation-name:cB;animation-duration:2.5s}
  .cC{animation-name:cC;animation-duration:2.5s}
  @keyframes cA{0%,1.5%{stroke-dashoffset:9;opacity:0}3%{opacity:1}10%{opacity:1}10.5%{stroke-dashoffset:-100;opacity:0}100%{stroke-dashoffset:-100;opacity:0}}
  @keyframes cB{0%,6%{stroke-dashoffset:9;opacity:0}11%{opacity:1}40%{opacity:1}42%{stroke-dashoffset:-100;opacity:0}100%{stroke-dashoffset:-100;opacity:0}}
  @keyframes cC{0%,44%{stroke-dashoffset:9;opacity:0}49%{opacity:1}72%{opacity:1}74%{stroke-dashoffset:-100;opacity:0}100%{stroke-dashoffset:-100;opacity:0}}

  .halo{opacity:0}
  .pS1{animation:p10 10s ease-out infinite}
  .pS2{animation:p25 2.5s ease-out infinite}
  .pM{animation:p25 2.5s ease-out 1s infinite}
  .pO{animation:pO 2.5s ease-out 1.8s infinite}
  @keyframes p10{0%{opacity:0}2.5%{opacity:1}9%{opacity:0}100%{opacity:0}}
  @keyframes p25{0%{opacity:0}9%{opacity:1}34%{opacity:0}100%{opacity:0}}
  .oglow{opacity:.55}
  @keyframes pO{0%{opacity:.55}10%{opacity:1}45%{opacity:.55}100%{opacity:.55}}
  .ring{opacity:0;animation:ring 2.5s ease-out 1.8s infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.7}60%{transform:scale(3.2);opacity:0}100%{transform:scale(3.2);opacity:0}}

  .tr{stroke-dasharray:16 84;animation:trace 7s linear infinite}
  @keyframes trace{to{stroke-dashoffset:-100}}

  .caret{animation:blink 1.2s ease-in-out infinite alternate}
  @keyframes blink{0%,30%{opacity:1}100%{opacity:.1}}

  .sweep{transform:translateX(-320px);animation:sweep 10s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-320px)}45%,100%{transform:translateX(1180px)}}

  /* mini band: 4 readings per 10 s loop, local 0% = the 1.85 s arrival */
  .q{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,.7,.3,1);animation-delay:-8.15s}
  .h5{transform:scaleX(.37);fill:#9b9a96;animation-name:h5}
  @keyframes h5{0%{transform:scaleX(.79);fill:#e5a14a}6%,25%{transform:scaleX(.18);fill:#9b9a96}31%,50%{transform:scaleX(.37);fill:#9b9a96}56%,75%{transform:scaleX(.58);fill:#b3a37e}81%,100%{transform:scaleX(.79);fill:#e5a14a}}
  .tk{transform:translateX(93px);fill:#dcdbd6;animation-name:tk}
  @keyframes tk{0%{transform:translateX(146px);fill:#e5534b}6%,25%{transform:translateX(60px);fill:#dcdbd6}31%,50%{transform:translateX(93px);fill:#dcdbd6}56%,75%{transform:translateX(124px);fill:#dcdbd6}81%,100%{transform:translateX(146px);fill:#e5534b}}
  .wk{transform:scaleX(.72);fill:#dcb253;animation-name:wk}
  @keyframes wk{0%{transform:scaleX(.97);fill:#e5534b}6%,25%{transform:scaleX(.57);fill:#b0a281}31%,50%{transform:scaleX(.72);fill:#dcb253}56%,75%{transform:scaleX(.86);fill:#e57f4b}81%,100%{transform:scaleX(.97);fill:#e5534b}}
  .cx{transform:scaleX(.45);animation-name:cx}
  @keyframes cx{0%{transform:scaleX(.62)}6%,25%{transform:scaleX(.38)}31%,50%{transform:scaleX(.45)}56%,75%{transform:scaleX(.53)}81%,100%{transform:scaleX(.62)}}

  .f{opacity:0;animation:fr 10s ease-out infinite}
  .f.on{opacity:1}
  .k0{animation-delay:-8.15s}.k1{animation-delay:-5.65s}.k2{animation-delay:-3.15s}.k3{animation-delay:-.65s}
  @keyframes fr{0%{opacity:0;transform:translateY(6px)}4%,24%{opacity:1;transform:translateY(0)}27%,100%{opacity:0;transform:translateY(0)}}

  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

<!-- card -->
<rect x="1" y="1" width="1198" height="478" rx="18" fill="url(#card)"/>
<g clip-path="url(#cardClip)">
  <g filter="url(#blob)">
    <circle class="b1" cx="990" cy="230" r="180" fill="#d97757" opacity=".3"/>
    <circle class="b2" cx="150" cy="110" r="140" fill="#e5b54a" opacity=".22"/>
    <circle class="b3" cx="190" cy="380" r="130" fill="#22d3ee" opacity=".2"/>
    <circle class="b4" cx="600" cy="320" r="140" fill="#a78bfa" opacity=".18"/>
  </g>
  <rect width="1200" height="480" fill="url(#dots)"/>
</g>
<rect x="1" y="1" width="1198" height="478" rx="18" fill="none" stroke="#3a3936"/>

<!-- header -->
<text x="48" y="66" font-size="32" font-weight="700" fill="url(#head)">How it works</text>
<text x="1152" y="64" font-size="17" text-anchor="end" class="m">Two live sources, merged on your machine</text>

<!-- connectors -->
<g fill="none" stroke-linecap="round">
  <path d="M378 162 C428 162 420 228 470 228" stroke="#3a3936" stroke-width="2"/>
  <path d="M378 294 C428 294 420 228 470 228" stroke="#3a3936" stroke-width="2"/>
  <path d="M706 228 H798" stroke="#3a3936" stroke-width="2"/>
  <g class="neon" filter="url(#spark)" stroke-width="7">
    <path d="M378 162 C428 162 420 228 470 228" stroke="url(#g1)"/>
    <path d="M378 294 C428 294 420 228 470 228" stroke="url(#g2)"/>
    <path d="M706 228 H798" stroke="url(#g3)"/>
  </g>
  <path class="flow" d="M378 162 C428 162 420 228 470 228" stroke="url(#g1)" stroke-width="3"/>
  <path class="flow" d="M378 294 C428 294 420 228 470 228" stroke="url(#g2)" stroke-width="3"/>
  <path class="flow" d="M706 228 H798" stroke="url(#g3)" stroke-width="3"/>
  <g filter="url(#spark)">
    <path class="cm cA" pathLength="100" d="M378 162 C428 162 420 228 470 228" stroke="#e5b54a" stroke-width="16"/>
    <path class="cm cB" pathLength="100" d="M378 294 C428 294 420 228 470 228" stroke="#22d3ee" stroke-width="16"/>
    <path class="cm cC" pathLength="100" d="M706 228 H798" stroke="#f0a483" stroke-width="16"/>
  </g>
  <path class="cm cA" pathLength="100" d="M378 162 C428 162 420 228 470 228" stroke="#fff4d6" stroke-width="5"/>
  <path class="cm cB" pathLength="100" d="M378 294 C428 294 420 228 470 228" stroke="#d6fbff" stroke-width="5"/>
  <path class="cm cC" pathLength="100" d="M706 228 H798" stroke="#ffe6da" stroke-width="5"/>
</g>

<!-- halos (pulse as data arrives) -->
<g filter="url(#soft)" fill="none" stroke-width="5">
  <rect class="halo pS1" x="48" y="112" width="330" height="100" rx="14" stroke="#e5b54a"/>
  <rect class="halo pS2" x="48" y="244" width="330" height="100" rx="14" stroke="#22d3ee"/>
  <rect class="halo pM" x="470" y="148" width="236" height="160" rx="14" stroke="#a78bfa"/>
  <rect class="oglow pO" x="798" y="104" width="354" height="248" rx="16" stroke="#d97757" stroke-width="8"/>
</g>

<!-- source 1 -->
<rect x="48" y="112" width="330" height="100" rx="14" fill="url(#node)" stroke="#3a3936"/>
<rect class="halo pS1" x="48" y="112" width="330" height="100" rx="14" fill="none" stroke="#e5b54a" stroke-opacity=".8"/>
<rect x="66" y="140" width="44" height="44" rx="12" fill="#e5b54a" fill-opacity=".14" stroke="#e5b54a" stroke-opacity=".35"/>
<path transform="translate(88 163)" d="M-11 7 H10 A6 6 0 0 0 10 -5 A8.5 8.5 0 0 0 -6 -6 A6.5 6.5 0 0 0 -11 7 Z" fill="none" stroke="#e5b54a" stroke-width="2" stroke-linejoin="round"/>
<text x="124" y="145" font-size="18" class="h">Anthropic usage service</text>
<text x="124" y="169" class="s">one request <tspan class="hi">~every 2 min</tspan>,</text>
<text x="124" y="190" class="s">through your existing login</text>

