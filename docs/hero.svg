<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Usage Quota for Claude Code: a live band showing 5 Hour and Weekly limits, a forecast to the reset, and context window usage">
<style>
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 10s cubic-bezier(.2,.7,.2,1) infinite both}
.tick{animation:tick 10s cubic-bezier(.2,.7,.2,1) infinite both}
.fade{animation:fade 10s cubic-bezier(.2,.7,.2,1) infinite both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
@keyframes grow{0%{transform:scaleX(0)}18%,100%{transform:scaleX(1)}}
@keyframes tick{0%,14%{opacity:0}26%,100%{opacity:1}}
@keyframes fade{0%,3%{opacity:0}14%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.grow,.tick,.fade{animation:none}}
</style>
<defs>
<clipPath id="bars">
  <rect x="100" y="68" width="300" height="8" rx="4"/>
  <rect x="100" y="138" width="300" height="8" rx="4"/>
  <rect x="520" y="68" width="546" height="8" rx="4"/>
</clipPath>
</defs>
<rect width="1200" height="440" rx="16" fill="#151515"/>
<text x="56" y="70" fill="#9a9a96" font-size="13" letter-spacing="2.4">CLAUDE CODE MOD</text>
<text x="56" y="118" fill="#efefec" font-size="42" font-weight="600">Usage Quota</text>
<text x="56" y="152" fill="#9a9a96" font-size="18">Know your Claude limits before they hit you.</text>
<g transform="translate(56,192)">
  <rect x=".5" y=".5" width="1087" height="203" rx="12" fill="#212121" stroke="#2c2c2b"/>
  <text class="fade" x="22" y="38" fill="#aca285" font-size="16" font-weight="600">At this pace you’ll run out before Sunday’s reset.</text>
  <rect x="740" y="24" width="30" height="18" rx="9" fill="#4d4d4a"/><circle cx="749" cy="33" r="6" fill="#efefec"/>
  <text x="782" y="38" fill="#9a9a96" font-size="15">Auto compact</text>
  <rect x="960" y="21" width="84" height="25" rx="6" fill="#373838"/>
  <text x="1002" y="38" fill="#efefec" font-size="14" text-anchor="middle">Compact</text>
  <path d="M1055 29h11l-5.5 7z" fill="#efefec"/>

  <text x="22" y="77" fill="#efefec" font-size="16" font-weight="600">5 Hour</text>
  <g clip-path="url(#bars)">
    <rect x="100" y="68" width="300" height="8" fill="#333332"/>
    <rect class="grow" x="100" y="68" width="21" height="8" fill="#9a9a96"/>
    <rect class="tick" x="264" y="68" width="3" height="8" fill="#dcdbd6"/>
  </g>
  <text x="440" y="77" fill="#9a9a96" font-size="16" text-anchor="end">7%</text>
  <text class="tick" x="22" y="102" fill="#9a9a96" font-size="14.5">On pace for about 55% by reset – resets in 4h 50m</text>

  <text x="22" y="147" fill="#efefec" font-size="16" font-weight="600">Weekly</text>
  <g clip-path="url(#bars)">
    <rect x="100" y="138" width="300" height="8" fill="#333332"/>
    <rect class="grow d1" x="100" y="138" width="171" height="8" fill="#aca285"/>
    <rect class="tick d1" x="397" y="138" width="3" height="8" fill="#e5534b"/>
  </g>
  <text x="440" y="147" fill="#aca285" font-size="16" font-weight="600" text-anchor="end">57%</text>
  <text class="tick d1" x="22" y="172" fill="#9a9a96" font-size="14.5">Limit will hit in 3d 3h – resets in 5d 11h</text>

  <g clip-path="url(#bars)">
    <rect x="520" y="68" width="546" height="8" fill="#333332"/>
    <g class="grow d2">
      <rect x="520" y="68" width="175" height="8" fill="#78d0ea"/>
      <rect x="695" y="68" width="19" height="8" fill="#a48ef2"/>
      <rect x="714" y="68" width="33" height="8" fill="#4d4d4a"/>
    </g>
  </g>
  <text x="520" y="108" fill="#efefec" font-size="16" font-weight="600">Context</text>
  <text x="600" y="108" fill="#aca285" font-size="16" font-weight="600">38% used</text>
  <text x="1066" y="108" fill="#9a9a96" font-size="15" text-anchor="end">583k free of 1M</text>
  <g class="fade d3">
    <text x="520" y="134" fill="#78d0ea" font-size="15">Messages</text><text x="1066" y="134" fill="#9a9a96" font-size="15" text-anchor="end">321k</text>
    <text x="520" y="158" fill="#a48ef2" font-size="15">Tools</text><text x="1066" y="158" fill="#9a9a96" font-size="15" text-anchor="end">35k</text>
    <text x="520" y="182" fill="#9a9a96" font-size="15">Other</text><text x="1066" y="182" fill="#9a9a96" font-size="15" text-anchor="end">28k</text>
  </g>
</g>
</svg>
