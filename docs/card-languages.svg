<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>16 languages: Hello, Merhaba, Bonjour, Привет, こんにちは and more cycle in a speech bubble</title>
<style>
.blob{transform-box:fill-box;transform-origin:center;animation:drift 12s ease-in-out infinite alternate}
.b1{animation-duration:10s;animation-delay:-4s}.b2{animation-duration:14s;animation-delay:-7s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-14px) scale(1.12)}100%{transform:translate(-22px,12px) scale(.94)}}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(0)}45%,100%{transform:translateX(620px)}}

.w{opacity:0;animation:w 11.2s ease-in-out infinite both -0.3s}.w0{opacity:1}
@keyframes w{0%{opacity:0;transform:translateY(12px)}1.6%,5.4%{opacity:1;transform:translateY(0)}7%,100%{opacity:0;transform:translateY(-12px)}}
.act{animation:act 11.2s steps(16,end) infinite -0.3s}
@keyframes act{to{transform:translateX(208px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#201f1d"/><stop offset="1" stop-color="#171615"/></linearGradient>
<clipPath id="cc"><rect x="1" y="1" width="558" height="298" rx="18"/></clipPath>
<linearGradient id="tg" x1="32" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f0a483"/><stop offset=".45" stop-color="#d97757"/><stop offset="1" stop-color="#e5b54a"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="tc"><text x="32" y="212" font-size="27" font-weight="700">16 languages</text></clipPath>
<radialGradient id="bl0"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.32"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><radialGradient id="bl1"><stop offset="0" stop-color="#d97757" stop-opacity="0.24"/><stop offset="1" stop-color="#d97757" stop-opacity="0"/></radialGradient><radialGradient id="bl2"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<linearGradient id="wg" x1="170" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#f0a483"/><stop offset="1" stop-color="#e5b54a"/></linearGradient>
<linearGradient id="bs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".8"/><stop offset="1" stop-color="#d97757" stop-opacity=".8"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="559" height="299" rx="18" fill="url(#card)" stroke="#3a3936"/>
<g clip-path="url(#cc)"><circle class="blob b0" cx="280" cy="70" r="230" fill="url(#bl0)"/><circle class="blob b1" cx="40" cy="280" r="190" fill="url(#bl1)"/><circle class="blob b2" cx="540" cy="30" r="150" fill="url(#bl2)"/></g>
<path d="M144 22 H416 A22 22 0 0 1 438 44 V106 A22 22 0 0 1 416 128 H196 L164 150 L172 128 H144 A22 22 0 0 1 122 106 V44 A22 22 0 0 1 144 22 Z" fill="#262523" fill-opacity=".85" stroke="url(#bs)" stroke-width="1.6" stroke-linejoin="round"/>
<g class="w w0" style="animation-delay:-0.3s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Hello</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">English</text></g><g class="w w1" style="animation-delay:0.4s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Merhaba</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Türkçe</text></g><g class="w w2" style="animation-delay:1.1s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Hallo</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Deutsch</text></g><g class="w w3" style="animation-delay:1.8s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Bonjour</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Français</text></g><g class="w w4" style="animation-delay:2.5s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Hola</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Español</text></g><g class="w w5" style="animation-delay:3.2s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Olá</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Português</text></g><g class="w w6" style="animation-delay:3.9s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Ciao</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Italiano</text></g><g class="w w7" style="animation-delay:4.6s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Hallo</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Nederlands</text></g><g class="w w8" style="animation-delay:5.3s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Cześć</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Polski</text></g><g class="w w9" style="animation-delay:6.0s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Привет</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Русский</text></g><g class="w w10" style="animation-delay:6.7s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Привіт</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Українська</text></g><g class="w w11" style="animation-delay:7.4s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">こんにちは</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">日本語</text></g><g class="w w12" style="animation-delay:8.1s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">안녕하세요</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">한국어</text></g><g class="w w13" style="animation-delay:8.8s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">你好</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">简体中文</text></g><g class="w w14" style="animation-delay:9.5s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">你好</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">繁體中文</text></g><g class="w w15" style="animation-delay:10.2s"><text x="280" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="url(#wg)">Halo</text><text x="280" y="110" text-anchor="middle" font-size="16" fill="#b8b6b0">Bahasa Indonesia</text></g>
<circle cx="182.5" cy="166" r="3" fill="#4a4946"/><circle cx="195.5" cy="166" r="3" fill="#4a4946"/><circle cx="208.5" cy="166" r="3" fill="#4a4946"/><circle cx="221.5" cy="166" r="3" fill="#4a4946"/><circle cx="234.5" cy="166" r="3" fill="#4a4946"/><circle cx="247.5" cy="166" r="3" fill="#4a4946"/><circle cx="260.5" cy="166" r="3" fill="#4a4946"/><circle cx="273.5" cy="166" r="3" fill="#4a4946"/><circle cx="286.5" cy="166" r="3" fill="#4a4946"/><circle cx="299.5" cy="166" r="3" fill="#4a4946"/><circle cx="312.5" cy="166" r="3" fill="#4a4946"/><circle cx="325.5" cy="166" r="3" fill="#4a4946"/><circle cx="338.5" cy="166" r="3" fill="#4a4946"/><circle cx="351.5" cy="166" r="3" fill="#4a4946"/><circle cx="364.5" cy="166" r="3" fill="#4a4946"/><circle cx="377.5" cy="166" r="3" fill="#4a4946"/>
<rect class="act" x="175.5" y="162" width="14" height="8" rx="4" fill="url(#wg)"/>
<text x="32" y="212" font-size="27" font-weight="700" fill="url(#tg)">16 languages</text>
<g clip-path="url(#tc)"><rect class="sheen" x="-140" y="180" width="120" height="40" fill="url(#sh)" style="animation-delay:6.0s"/></g>
<text x="32" y="244" font-size="18" fill="#b8b6b0">Follows the app’s language, or pick one</text><text x="32" y="268" font-size="18" fill="#b8b6b0">in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f0a483">/quota-settings</tspan>.</text>
</svg>
